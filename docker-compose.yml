services:
  cassandra:
    image: cassandra:latest
    container_name: cassandra_db
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - project_network

  mongodb:
    image: mongo:8.0.4
    container_name: mongodb_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - project_network

  dgraph-zero:
    image: dgraph/dgraph:latest
    container_name: dgraph_zero
    ports:
      - "5080:5080"
      - "6080:6080"
    command: dgraph zero --my=dgraph-zero:5080
    networks:
      - project_network

  dgraph:
    image: dgraph/dgraph:latest
    container_name: dgraph_db
    ports:
      - "8080:8080"
      - "9080:9080"
    command: dgraph alpha --my=dgraph:7080 --zero=dgraph-zero:5080
    networks:
      - project_network
    depends_on:
      - dgraph-zero

  ratel:
    image: dgraph/ratel:latest
    container_name: ratel_ui
    ports:
      - "8000:8080"
    environment:
      - DGRAPH_HOST=dgraph:8080
    networks:
      - project_network
    restart: always

  backend:
    build: ./backend
    container_name: backend_api
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=mongodb://mongodb:27017
      - CASSANDRA_HOST=cassandra
      - DGRAPH_HOST=dgraph:8080
    networks:
      - project_network
    depends_on:
      - mongodb
      - cassandra
      - dgraph

  frontend:
    build: ./frontend
    container_name: frontend_web
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - project_network
    depends_on:
      - backend

networks:
  project_network:
    driver: bridge

volumes:
  cassandra_data:
  mongodb_data:
